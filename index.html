    <script>
      // Ensure window.fetch has both a getter and setter to prevent
      // "Cannot set property fetch of #<Window> which has only a getter"
      // when sandboxed iframes or proxy wrappers intercept network requests.
      (function() {
        try {
          var _fetchTarget = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetchTarget;
            },
            set: function(fn) {
              _fetchTarget = fn;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          // Fallback if environment restricts property redefinition
        }
      })();
    </script>
